services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: streaming
    ports:
      - "5432:5432"
    volumes:
      - streaming-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d streaming"]
      interval: 2s
      timeout: 3s
      retries: 15

  server:
    build:
      context: ./server
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/streaming?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  streaming-pg-data:
